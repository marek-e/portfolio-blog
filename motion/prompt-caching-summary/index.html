<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url(../../node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2);
        font-weight: 400;
      }
      @font-face {
        font-family: Geist;
        src: url(../../node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2);
        font-weight: 500;
      }
      @font-face {
        font-family: Geist;
        src: url(../../node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2);
        font-weight: 600;
      }
      @font-face {
        font-family: Geist;
        src: url(../../node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2);
        font-weight: 700;
      }
      @font-face {
        font-family: Maple;
        src: url(../../public/fonts/MapleMono-Regular.ttf.woff2);
        font-weight: 400;
      }
      @font-face {
        font-family: Maple;
        src: url(../../public/fonts/MapleMono-Medium.ttf.woff2);
        font-weight: 500;
      }
      :root {
        --bg: #0a0b0f;
        --panel: #12141a;
        --panel2: #171a22;
        --line: #262a33;
        --text: #edeef0;
        --muted: #8b909a;
        --dim: #4b505a;
        --blue: #7aa2ff;
        --amber: #ffb547;
        --green: #4ade80;
        --red: #ff6b6b;
        --purple: #b794f6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Geist, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1100px 700px at 85% -10%, rgba(122, 162, 255, 0.09), transparent 60%),
          radial-gradient(900px 650px at -5% 110%, rgba(255, 181, 71, 0.07), transparent 60%);
      }
      .grid {
        position: absolute;
        left: -80px;
        top: -80px;
        width: 2080px;
        height: 1240px;
        background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1.2px, transparent 1.2px);
        background-size: 40px 40px;
        -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
      }
      .a {
        position: absolute;
      }
      .mono {
        font-family: Maple, monospace;
      }
      .kicker {
        position: absolute;
        left: 120px;
        top: 104px;
        font-family: Maple;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .h1 {
        position: absolute;
        left: 120px;
        top: 142px;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
        width: 1680px;
      }
      .sub {
        position: absolute;
        left: 120px;
        top: 240px;
        font-size: 29px;
        color: var(--muted);
        width: 1500px;
        line-height: 1.4;
        letter-spacing: -0.005em;
      }
      .w {
        display: inline-block;
      }
      .code {
        font-family: Maple, monospace;
        font-size: 0.9em;
        letter-spacing: 0;
      }
      .brand {
        position: absolute;
        right: 120px;
        top: 104px;
        font-family: Maple;
        font-size: 18px;
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      .progress {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: 56px;
        height: 2px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 2px;
      }
      .progress i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--amber);
        border-radius: 2px;
      }
      .progress b {
        position: absolute;
        top: -3px;
        width: 2px;
        height: 8px;
        background: rgba(255, 255, 255, 0.18);
      }
      .pill {
        position: absolute;
        font-family: Maple;
        font-size: 20px;
        padding: 8px 16px;
        border-radius: 999px;
        white-space: nowrap;
        font-weight: 500;
      }
      .card {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .seg {
        position: absolute;
        top: 0;
        height: 96px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Maple;
        font-size: 19px;
        overflow: hidden;
        white-space: nowrap;
      }
      .cell {
        position: absolute;
        width: 52px;
        height: 64px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
      }
      .chip {
        position: absolute;
        height: 76px;
        width: 180px;
        border-radius: 14px;
        background: var(--panel2);
        border: 1.5px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Maple;
        font-size: 28px;
      }
      .kv {
        position: absolute;
        height: 52px;
        width: 180px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Maple;
        font-size: 24px;
        color: var(--purple);
        background: rgba(183, 148, 246, 0.08);
        border: 1.5px solid rgba(183, 148, 246, 0.25);
        letter-spacing: 0.08em;
      }
      .bar {
        position: absolute;
        height: 56px;
        border-radius: 10px;
      }
      .lbl {
        position: absolute;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="bg"></div>
      <div class="grid" id="grid"></div>
    </div>
    <script src="copy.js"></script>
    <script src="timeline.js"></script>
  </body>
</html>
