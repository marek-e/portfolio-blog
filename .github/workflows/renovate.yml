name: Renovate

on:
  # Runs every 6 hours rather than weekly on purpose. renovate.json restricts
  # *branch creation* to Monday mornings, but Renovate can only merge an
  # already-green PR during a run - so a weekly cron would leave automerged
  # updates sitting until the following Monday.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          LOG_LEVEL: info
